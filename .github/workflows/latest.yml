# 📺 윌팍 최근 영상 N편 (이미 한 것·쇼츠·같은 제목 빼고) → Gemini 상세 요약 + 차트 장면 바로가기 → results 가지 {영상ID}/
name: latest
on:
  workflow_dispatch:
    inputs:
      n:
        description: "몇 편"
        default: "5"
permissions:
  contents: write
concurrency: grab
jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 지금까지 한 것
        run: git fetch origin results && git worktree add done FETCH_HEAD || mkdir -p done
      - name: Gemini 로 보기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python batch_watch.py "${{ inputs.n || 5 }}" done out
      - name: 올리기
        run: |
          ls out >/dev/null 2>&1 || { echo "새 결과 없음"; exit 0; }
          cd done
          cp -r ../out/* . && git add -A
          git -c user.name=grab-bot -c user.email=grab@users.noreply.github.com commit -qm "📺 최근 영상 $(ls ../out | tr '\n' ' ')"
          git push -q origin HEAD:results
