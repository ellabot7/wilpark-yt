# 📨 나스닥선물 사금·황금선 닿음 알림 → 텔레그램 (공개 창고라 GitHub 작업 시간 무료 · 회장님 2026-11-18)
# 무엇을: kiwoom-auto-trader surge_screener/nqline.py 가 야후 NQ=F 1분봉을 1분마다 보고
#   🟫 사금 · 🟨 황금선에 닿으면 한 줄, 240선 아래 장(전날 나스닥100 종가 < 일봉 지수이평 240)에서 황금선을 1틱 넘게 뚫으면 ▲ 돌파 한 줄
#   (선은 앱 차트와 같은 식 · 야후 선물 시세가 약 10분 늦어 알림도 그만큼 늦음, 글에 닿은 시각을 적음)
# 왔다갔다 중복 막기: 선마다 처음 닿을 때 한 번 → 전날 폭의 1/4 넘게 멀어졌다가 다시 닿을 때만 · 앞 알림에서 30분 · 하루 3번까지
#   보낸 기록 = app-data 의 digest/nqline_tg_state.json (작업이 바뀌어도 같은 알림 두 번 안 감)
# 켜기·끄기: 앱 📈 지수 차트 › 나스닥 선물 분봉 아래 · 📱 라이트 ☰ → app-data 의 digest/nqline_tg.json (파일이 없으면 켬)
# 언제 도나: 작업 하나가 5시간 반 동안 1분마다 확인하고, 끝날 때 장이 열려 있으면 다음 작업을 바로 부름
#   (GitHub 예약은 몇 시간씩 늦거나 빠져서 예약은 끊겼을 때 다시 잇는 용도). 장 = 뉴욕 일 18:00 ~ 금 17:00, 월~목 17~18시 쉼
# 필요한 비밀값: KIWOOM_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (dipalert 와 같음)
name: nqline
on:
  schedule:
    - cron: "11 */2 * * 0-5"   # 두 시간마다 (끊겼을 때 다시 잇기 · 이미 돌고 있으면 줄 서서 기다림)
    - cron: "41 20,21,22 * * 0" # 일요일 밤 장 열리기 전 (한국 월요일 05:41·06:41·07:41)
  workflow_dispatch:
    inputs:
      dry:
        description: "시험: 텔레그램을 보내지 않고 실행 기록에만 찍기 (보낸 기록도 안 씀)"
        type: boolean
        default: false
      minutes:
        description: "몇 분 동안 지켜볼지 (최대 330)"
        default: "330"
permissions:
  contents: read
  actions: write              # 끝날 때 다음 작업 부르기
concurrency: nqline           # 한 번에 하나만 (다음 작업은 줄 서서 기다림)
jobs:
  nqline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      REPO: ellabot7/kiwoom-auto-trader
    steps:
      - name: 알림 켜져 있나
        id: cfg
        env:
          TOKEN: ${{ secrets.KIWOOM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "비밀값 KIWOOM_TOKEN 이 없음"; exit 1; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, json, os, sys, urllib.request, urllib.error
          r = urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/digest/nqline_tg.json?ref=app-data",
                                     headers={"Authorization": f"Bearer {os.environ['TOKEN']}", "Accept": "application/vnd.github+json"})
          try:
              on = bool(json.loads(base64.b64decode(json.load(urllib.request.urlopen(r))["content"])).get("on", True))
          except urllib.error.HTTPError as e:
              on = e.code == 404                                      # 설정 파일이 없으면 켬 (surge_screener/nqline.py DEFAULT_CFG)
          print(f"{'켜짐' if on else '꺼짐'}", file=sys.stderr)
          print(f"on={'1' if on else '0'}")
          PY
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.on == '1'
        with:
          repository: ellabot7/kiwoom-auto-trader
          ref: master
          token: ${{ secrets.KIWOOM_TOKEN }}
      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.on == '1'
        with:
          python-version: "3.12"
      - if: steps.cfg.outputs.on == '1'
        run: pip install -q pandas numpy requests yfinance
      - name: 지켜보며 보내기
        id: run
        if: steps.cfg.outputs.on == '1'
        env:
          TOKEN: ${{ secrets.KIWOOM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINUTES: ${{ inputs.minutes || '330' }}
          DRY: ${{ inputs.dry && '--dry' || '' }}
        run: python -u -m surge_screener.nqline --watch "$MINUTES" $DRY
      - name: 다음 작업 부르기
        if: always() && steps.run.outputs.next == '1' && inputs.dry != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nqline.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
