# 🧵 오늘 스레드 요약 → 텔레그램 (kiwoom-auto-trader 대신 여기서 돌림: 공개 창고라 GitHub 작업 시간 무료)
# 앱 🧵 버튼은 그대로 kiwoom-auto-trader app-data 에 요청을 적고, 여기서 10분마다 새 요청이 있는지 보고 실행한다.
# 코드는 비공개 창고(kiwoom-auto-trader)에서 그때그때 받아 쓰고, 결과(요약·보낸 글 기록)도 그쪽 app-data 에 쓴다.
# 필요한 비밀값: KIWOOM_TOKEN(kiwoom-auto-trader 읽기·쓰기 토큰), TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GEMINI_API_KEY, THREADS_COOKIES(있으면)
name: threads
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "요청 없어도 지금 바로 요약 보내기"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: threads
jobs:
  threads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: ellabot7/kiwoom-auto-trader
    steps:
      - name: 새 요청 있나
        id: req
        env:
          TOKEN: ${{ secrets.KIWOOM_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$TOKEN" ]; then echo "비밀값 KIWOOM_TOKEN 이 없음"; exit 1; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, json, os, sys, urllib.request
          from datetime import datetime, timedelta, timezone
          def get(path):
              r = urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}?ref=app-data",
                                         headers={"Authorization": f"Bearer {os.environ['TOKEN']}", "Accept": "application/vnd.github+json"})
              try:
                  return json.loads(base64.b64decode(json.load(urllib.request.urlopen(r))["content"]))
              except urllib.error.HTTPError as e:
                  if e.code == 404: return {}
                  raise
          if os.environ.get("FORCE") == "true":
              print("run=true"); print("수동 실행", file=sys.stderr); sys.exit()
          at = get("digest/requests/threads_today.json").get("at", "")
          now = datetime.now(timezone(timedelta(hours=9)))
          done = get(f"digest/threads_today/{at[:10]}.json").get("at", "") if at else ""
          fresh = bool(at) and now - datetime.fromisoformat(at).replace(tzinfo=now.tzinfo) < timedelta(hours=12)
          run = fresh and at[:16] > done[:16]
          print(f"요청 {at or '없음'} · 마지막 요약 {done or '없음'} → {'실행' if run else '건너뜀'}", file=sys.stderr)
          print(f"run={'true' if run else 'false'}")
          PY
      - uses: actions/checkout@v5
        if: steps.req.outputs.run == 'true'
        with:
          repository: ellabot7/kiwoom-auto-trader
          ref: master
          token: ${{ secrets.KIWOOM_TOKEN }}
      - uses: actions/setup-python@v6
        if: steps.req.outputs.run == 'true'
        with:
          python-version: "3.12"
      - if: steps.req.outputs.run == 'true'
        run: pip install -q pandas numpy requests finance-datareader playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: 오늘 스레드 요약 보내기
        if: steps.req.outputs.run == 'true'
        env:
          TOKEN: ${{ secrets.KIWOOM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_COOKIES: ${{ secrets.THREADS_COOKIES }}
        run: |
          if [ -n "$THREADS_COOKIES" ]; then printf '%s' "$THREADS_COOKIES" > "$RUNNER_TEMP/tc.txt"; export THREADS_COOKIES_FILE="$RUNNER_TEMP/tc.txt"; fi
          unset THREADS_COOKIES
          # 공개 창고라 실행 기록을 누구나 볼 수 있음 → 요약 내용은 화면에 찍지 않고 몇 줄만
          export GITHUB_REPOSITORY="$REPO" GITHUB_TOKEN="$TOKEN"
          if python -m digest.run --threads-today > "$RUNNER_TEMP/out.txt" 2>&1; then
            grep -E "^@|텔레그램" "$RUNNER_TEMP/out.txt" | cut -c1-120 || true
          else
            tail -40 "$RUNNER_TEMP/out.txt"; exit 1
          fi
