# 🤖 Gemini 로 유튜브 영상 보기: 영상 받기 없이 구글이 직접 봄 → results 가지 {영상ID}/summary.md, charts.json
# 필요: 비밀값 GEMINI_API_KEY (aistudio.google.com 무료 키)
name: watch
on:
  workflow_dispatch:
    inputs:
      vid:
        description: "유튜브 영상 ID 또는 주소"
        required: true
      only:
        description: "이것만 다시 (예: charts.json), 비우면 전부"
        default: ""
      ask:
        description: "따로 물어볼 질문 (비우면 요약·장면)"
        default: ""
      ask_name:
        description: "질문 답 파일 이름 (예: ask_1106.md)"
        default: "ask.md"
      models:
        description: "모델 (쉼표, 비우면 flash 둘). 한도 바닥이면 gemini-flash-lite-latest"
        default: ""
      clip:
        description: "구간만 자세히 보기, 초 단위 시작-끝 (예: 640-720)"
        default: ""
permissions:
  contents: write
concurrency: grab
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 영상 ID
        run: |
          V=$(python -c "import re,sys;s=sys.argv[1];m=re.search(r'(?:v=|youtu\.be/|shorts/|live/)([\w-]{11})',s);print(m.group(1) if m else s.strip())" "${{ inputs.vid }}")
          echo "VID=$V" >> "$GITHUB_ENV"
      - name: Gemini 로 보기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ inputs.only }}
          ASK: ${{ inputs.ask }}
          ASK_NAME: ${{ inputs.ask_name }}
          CLIP: ${{ inputs.clip }}
          MODELS: ${{ inputs.models }}
        run: python gemini_watch.py "$VID" "out/$VID"
      - name: 올리기
        run: |
          git fetch origin results && git checkout -q -B results FETCH_HEAD || git checkout -q --orphan results
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p "$VID"; cp out/$VID/* "$VID"/ 2>/dev/null || { echo "결과 없음"; exit 1; }
          git add "$VID"
          git -c user.name=grab-bot -c user.email=grab@users.noreply.github.com commit -qm "🤖 $VID gemini"
          git push -q origin results
